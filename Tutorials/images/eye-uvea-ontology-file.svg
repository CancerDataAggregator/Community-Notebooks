<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" font-family="Arial, sans-serif">
<text x="520" y="100" text-anchor="middle" fill="#2d8a3e" font-size="12" font-weight="bold">searching eye</text>
<text x="520" y="115" text-anchor="middle" fill="#2d8a3e" font-size="12" font-weight="bold">finds all of this (down arrow)</text>
<rect x="220" y="20" width="120" height="50" rx="8" fill="#4f6df5" stroke="#2d3fa0" stroke-width="2"/>
<text x="280" y="50" text-anchor="middle" fill="white" font-size="16" font-weight="bold">eye</text>
<line x1="280" y1="70" x2="110" y2="130" stroke="#999" stroke-width="2"/>
<line x1="280" y1="70" x2="280" y2="130" stroke="#999" stroke-width="2"/>
<line x1="280" y1="70" x2="450" y2="130" stroke="#999" stroke-width="2"/>
<rect x="50" y="130" width="120" height="50" rx="8" fill="#7c93f7" stroke="#2d3fa0" stroke-width="2"/>
<text x="110" y="160" text-anchor="middle" fill="white" font-size="15" font-weight="bold">uvea</text>
<rect x="220" y="130" width="120" height="50" rx="8" fill="#c3cdfa" stroke="#2d3fa0" stroke-width="2"/>
<text x="280" y="160" text-anchor="middle" fill="#2d3fa0" font-size="15">retina</text>
<rect x="390" y="130" width="120" height="50" rx="8" fill="#c3cdfa" stroke="#2d3fa0" stroke-width="2"/>
<text x="450" y="160" text-anchor="middle" fill="#2d3fa0" font-size="15">cornea</text>
<line x1="110" y1="180" x2="60" y2="230" stroke="#999" stroke-width="2"/>
<line x1="110" y1="180" x2="160" y2="230" stroke="#999" stroke-width="2"/>
<rect x="20" y="230" width="80" height="40" rx="6" fill="#e3e8fd" stroke="#2d3fa0" stroke-width="1.5"/>
<text x="60" y="255" text-anchor="middle" fill="#2d3fa0" font-size="12">iris</text>
<rect x="120" y="230" width="80" height="40" rx="6" fill="#e3e8fd" stroke="#2d3fa0" stroke-width="1.5"/>
<text x="160" y="255" text-anchor="middle" fill="#2d3fa0" font-size="12">choroid</text>
<line x1="60" y1="225" x2="275" y2="75" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
<text x="440" y="250" text-anchor="middle" fill="#c0392b" font-size="12" font-weight="bold">but searching iris</text>
<text x="440" y="265" text-anchor="middle" fill="#c0392b" font-size="12" font-weight="bold">does NOT find eye (X)</text>
<text x="280" y="330" text-anchor="middle" fill="#333" font-size="12" font-style="italic">(simplified for illustration -- the real UBERON tree has more levels and more siblings)</text>
<text x="280" y="348" text-anchor="middle" fill="#333" font-size="12" font-style="italic">Broad terms reach down to specific ones. Specific terms never reach back up.</text>
</svg>
